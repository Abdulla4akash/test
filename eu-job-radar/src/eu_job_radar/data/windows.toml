# Internship and graduate programmes at large employers that have no public
# job-board API. Each record holds claims about opening and closing dates,
# each with a basis, exactly like eu-phd-radar's calls.toml:
#
#   current_cycle_announcement  read on the official page for this cycle,
#                               with `wording` quoted from it. Only these are
#                               shown as fixed deadlines.
#   owner_reported              a date the repository owner reported. Shown,
#                               clearly labelled, until someone reads it on
#                               the official page and upgrades the basis.
#   not_yet_verified            no date found; stays unknown.
#
# `pattern` describes what usually happens. It is never a date and never
# becomes one. A past cycle's date is never copied into a new cycle.
# `job-radar windows-check` re-reads the pages and reports whether each
# quoted wording is still there; it never edits this file.
#
# Checked live 2026-09-25. See docs/sources.md for evidence and access limits.

registry_version = 1

[[windows]]
id = "google-swe-intern"
cycle = "2027"
company = "Google"
programme = "Software Engineering / SRE BS/MS Intern (EMEA)"
kind = "internship"
where = "UK, CH, DE, PL, RO, FR, IE, SE"
page = "https://www.google.com/about/careers/applications/jobs/results/100028133205254854-software-engineering-site-reliability-engineering-bsms-intern-2027"
pattern = "Summer internships usually open in late summer or autumn of the year before and can close early once roles fill."
[windows.opens]
basis = "not_yet_verified"
source = "https://www.google.com/about/careers/applications/jobs/results/100028133205254854-software-engineering-site-reliability-engineering-bsms-intern-2027"
checked_on = "2026-09-25"
note = "The checked 2027 EMEA BS/MS and PhD SWE/SRE internships say before 23 October. This date applies to those postings only. The internship associated with the owner-reported 7 October remains unidentified. Time and timezone are not stated; apply early. See docs/sources.md."

[windows.closes]
basis = "current_cycle_announcement"
date = "2026-10-23"
wording = "Please complete your application before 23rd October 2026."
source = "https://www.google.com/about/careers/applications/jobs/results/100028133205254854-software-engineering-site-reliability-engineering-bsms-intern-2027"
checked_on = "2026-09-25"
note = "The checked 2027 EMEA BS/MS and PhD SWE/SRE internships say before 23 October. This date applies to those postings only. The internship associated with the owner-reported 7 October remains unidentified. Time and timezone are not stated; apply early. See docs/sources.md."

