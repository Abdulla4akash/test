# Company job boards eu-job-radar can read, through each company's public
# applicant-tracking-system (ATS) API. See docs/sources.md for the APIs.
#
# token_status is honest about what has been checked:
#   unverified  the board token is the tool author's best knowledge; it has not
#               been fetched. A wrong token shows as "board not found (404)" in
#               `job-radar boards` after the first collection; fix or disable it.
#   verified    a fetch on `checked_on` returned a readable board.
# All retained boards returned readable inventories on 2026-09-25.
# DeepMind now uses Google Careers; Plaid and Mistral moved to Ashby.
# See docs/sources.md for the full check log. Add boards with
# `job-radar boards-add --url <careers board URL>` in your workspace.

[[boards]]
id = "anthropic"
company = "Anthropic"
ats = "greenhouse"
token = "anthropic"
kind = "AI lab"
careers = "https://www.anthropic.com/careers"
token_status = "verified"
checked_on = "2026-09-25"

