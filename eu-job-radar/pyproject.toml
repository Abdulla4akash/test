[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eu-job-radar"
version = "0.1.0"
description = "Find, screen and track software, ML and AI engineering jobs in the EU and UK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
job-radar = "eu_job_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_job_radar"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
